; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
; Board definition covers any ESP32-S3 devkit (DevKitC-1, DevKit-1, ...) —
; same chip, same env; only the module variant differs.
board = esp32-s3-devkitc-1
framework = arduino

; Since v2.74 the MLB board uses the same devkit as the NHL scoreboard
; (YD-ESP32-S3-family 44-pin DevKitC-1 clone), N8R8 module: 8 MB flash,
; 8 MB octal PSRAM (permanently reserves GPIO 35-37; PSRAM is initialized
; at boot by the qio_opi SDK libs and sits in the main heap, but
; BOARD_HAS_PSRAM is NOT defined, so an Arduino String still caps at
; 65,535 bytes — never buffer a feed body in a String). OTA app slots are
; 3.375 MB each (partitions.csv) plus a coredump partition that stores
; crash summaries for the portal's diagnostics page. Moving a board off
; the old 4MB DevKitC build REQUIRES a USB flash: both the memory type
; and the partition table change (OTA cannot repartition).
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv

; `pio run -e esp32-s3-devkitc-1 -t deploy` builds the firmware and copies
; it into releases/ as mlb_scoreboard_latest.bin plus a permanently archived
; mlb_scoreboard_<version>.bin matching FIRMWARE_VERSION in src/config.h.
extra_scripts = tools/release_deploy.py

monitor_speed = 115200

; Sport selection: each env compiles the generic framework in src/common/ plus
; exactly ONE folder under src/sports/. The -I flag puts that folder on the
; include path so "sport_config.h" (and the sport's own headers) resolve to
; the selected sport — src/common/ never names a sport directly.
; Starting a new sport: copy src/sports/mlb, then change sports/mlb below to
; the new folder in BOTH places.
build_src_filter =
    +<main.cpp>
    +<common/>
    +<sports/mlb/>

build_flags =
    ; Dev serial + USB flashing go through the board's CH343 UART-bridge
    ; port (UART0): the v2.76 rewire put the MAX7219 CLK on GPIO 20, which
    ; is the ESP32-S3's native USB D+ line, so the native USB-C port can
    ; no longer enumerate. (The native port still supplies power.) To use
    ; native-USB CDC again some day, the matrix CLK must move off GPIO 20
    ; and this flag flips back to 1.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Isrc/sports/mlb

lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    ricmoo/QRCode@^0.0.1
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit ILI9341@^1.5.6
    adafruit/Adafruit BusIO@^1.15.0

; Network OTA env for development: flash over Wi-Fi (ArduinoOTA) instead of USB.
; Usage: pio run -e esp32-s3-devkitc-1-ota -t upload --upload-port <device-ip-or-baseball-scoreboard.local>
; mDNS (.local) discovery over Wi-Fi is occasionally flaky (dropped multicast packets) -
; retry once if "no response" occurs, or pass --upload-port with the device's IP
; (printed on Serial as "[NET] Online: ip=..." and shown on the TFT setup screen) to skip discovery entirely.
; The device's per-device hostname is baseball-scoreboard-<mac-suffix>.local.
[env:esp32-s3-devkitc-1-ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = baseball-scoreboard.local
upload_flags =
    --auth=score1234
    --timeout=120
