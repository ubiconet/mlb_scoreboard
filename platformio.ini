; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 4MB
board_upload.flash_size = 4MB
; Stock default.csv only gives 1.25MB per OTA app slot, which the firmware now
; exceeds. This custom table shrinks the (mostly unused) LittleFS partition and
; grows app0/app1 to 1.5MB each, still fitting the physical 4MB flash.
board_build.partitions = partitions.csv

; `pio run -e esp32-s3-devkitc-1 -t deploy` builds the firmware and copies
; it into releases/ as mlb_scoreboard_latest.bin plus a permanently archived
; mlb_scoreboard_<version>.bin matching FIRMWARE_VERSION in src/config.h.
extra_scripts = tools/release_deploy.py

monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    ricmoo/QRCode@^0.0.1
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit BusIO@^1.15.0

; Network OTA env for development: flash over Wi-Fi (ArduinoOTA) instead of USB.
; Usage: pio run -e esp32-s3-devkitc-1-ota -t upload --upload-port <device-ip-or-mlb-scoreboard.local>
; mDNS (.local) discovery over Wi-Fi is occasionally flaky (dropped multicast packets) -
; retry once if "no response" occurs, or pass --upload-port with the device's IP
; (printed on Serial as "[NET] Online: ip=..." and shown on the TFT setup screen) to skip discovery entirely.
[env:esp32-s3-devkitc-1-ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = mlb-scoreboard.local
upload_flags =
    --auth=score1234
    --timeout=120
